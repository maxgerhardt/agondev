name: Build AgonDev

permissions:
  actions: read
  contents: read

on:
  push:
  workflow_dispatch:

jobs:
  build-agondev:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download LLVM artifact from another run
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # REQUIRED
        run: |
          $Owner = "${{ github.repository_owner }}"
          $Repo = "${{ github.event.repository.name }}"
          $RunId = "19610540421"
          $ArtifactName = "llvm-ez80-msvc"

          $Headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
          }

          Write-Host "Fetching artifact list..."
          $ApiUrl = "https://api.github.com/repos/$Owner/$Repo/actions/runs/$RunId/artifacts"
          $RunInfo = Invoke-RestMethod -Headers $Headers -Uri $ApiUrl -Method GET

          $Artifact = $RunInfo.artifacts | Where-Object { $_.name -eq $ArtifactName }

          if (-not $Artifact) {
            Write-Error "Artifact '$ArtifactName' not found in run $RunId"
            exit 1
          }

          Write-Host "Downloading artifact..."
          Invoke-RestMethod -Headers $Headers -Uri $Artifact.archive_download_url -Method GET -OutFile "llvm.zip"

          Write-Host "Preparing llvm-build structure..."
          New-Item -ItemType Directory -Force -Path "llvm-build/ez80-none-elf" | Out-Null

          Write-Host "Extracting..."
          Expand-Archive "llvm.zip" -DestinationPath "llvm-build/ez80-none-elf" -Force

          Write-Host "==== DEBUG: List extracted structure ===="
          Write-Host "Top-level:"
          Get-ChildItem -Recurse -Depth 1 llvm-build
          
          Write-Host "ez80-none-elf contents:"
          Get-ChildItem -Recurse -Depth 2 llvm-build\ez80-none-elf

          Write-Host "==== END DEBUG ===="

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: |
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            git
            zip
            make
            cmake
            texinfo
            ninja
            gmp-devel
            mpfr-devel
            bison
            flex
            mingw-w64-x86_64-python-ply
            zlib-devel
            diffutils
            mingw-w64-x86_64-gcc
            binutils

      - name: Add MINGW64 Python to PATH
        run: |
          echo "${{ steps.setup-msys2.outputs.msys2-location }}/mingw64/bin" >> "$GITHUB_PATH"

      - name: Verify Python
        run: |
          python --version
          pip --version

      - name: Run make_llvmtools.sh
        run: |
          ./make_llvmtools.sh

      - name: Build final AgonDev package
        run: |
          make clean || true
          make -j$(nproc)

      - name: Upload final release artifact
        uses: actions/upload-artifact@v5
        with:
          name: agondev-${{ github.ref_name }}
          path: agondev-*.tar.gz
