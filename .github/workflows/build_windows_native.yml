name: Build LLVM (MSVC)

on:
  push:
  pull_request:

jobs:
  build-llvm:
    runs-on: windows-2022

    env:
      LLVM_PROJECT_DIR: ${{ github.workspace }}/llvm-project
      BUILD_DIR: ${{ github.workspace }}/build
      INSTALL_DIR: ${{ github.workspace }}/install

    steps:
    - name: Checkout workflow repo
      uses: actions/checkout@v6

    - name: Clone EZ80 LLVM fork
      run: |
        git clone --branch z80-as --depth 1 https://github.com/envenomator/llvm-project.git $LLVM_PROJECT_DIR

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Configure LLVM (Visual Studio)
      run: |
        mkdir -p $BUILD_DIR
        cd $BUILD_DIR
        cmake -G "Visual Studio 17 2022" ^
              -A x64 ^
              -Thost=x64 ^
              -DLLVM_ENABLE_PROJECTS=clang ^
              -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD=Z80 ^
              -DLLVM_TARGETS_TO_BUILD= ^
              -DLLVM_DEFAULT_TARGET_TRIPLE=ez80-none-elf ^
              -DCMAKE_BUILD_TYPE=Release ^
              -DCMAKE_INSTALL_PREFIX=$INSTALL_DIR ^
              ../llvm-project/llvm

    - name: Build and install LLVM
      run: |
        cd $BUILD_DIR
        cmake --build . --config Release --target INSTALL -- /maxcpucount

    - name: Upload LLVM artifact
      uses: actions/upload-artifact@v3
      with:
        name: llvm-ez80-msvc
        path: ${{ env.INSTALL_DIR }}
